rules = [
  DisableSyntax
  LeakingImplicitClassVal
  NoAutoTupling
  NoValInForComprehension
  ProcedureSyntax
  RedundantSyntax
  OrganizeImports
]

DisableSyntax {
  noNulls = true
  noReturns = true
  noXml = false
  noFinalize = true

  regex = [
    {
      id = "noClone"
      pattern = "\\.clone\\(\\)"
      message = "Don't call .clone(); copy explicitly."
    }
    {
      id = "noPrintln"
      pattern = "(?<!\\.)\\bprintln\\b"
      message = "Don't use println; use a logger."
    }
    {
      id = "noTripleQuestion"
      pattern = "\\?\\?\\?"
      message = "??? left in code; finish the implementation."
    }
    {
      id = "uppercaseL"
      pattern = "\\b\\d+l\\b"
      message = "Use uppercase L for Long literals (e.g. 100L not 100l)."
    }
    {
      id = "todoComment"
      pattern = "(?i)\\b(TODO|FIXME)\\b"
      message = "Resolve TODO/FIXME before merging."
    }
    {
      id = "noSunImport"
      pattern = "import\\s+sun\\."
      message = "Don't import from sun.*"
    }
    {
      id = "noAwtImport"
      pattern = "import\\s+java\\.awt\\."
      message = "Don't import from java.awt.*"
    }
  ]
}

OrganizeImports {
  removeUnused = true
  groupedImports = Merge
  expandRelative = true
}
